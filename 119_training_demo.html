<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>119番通報 疑似体験デモ</title>
<style>
  :root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --ink:#1f2937;
    --muted:#6b7280;
    --accent:#d62828;
    --accent2:#f97316;
    --ok:#15803d;
    --line:#e5e7eb;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Yu Gothic",sans-serif;
    background:linear-gradient(180deg,#eef3f8 0%,#f8fafc 100%);
    color:var(--ink);
  }
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}
  .hero{
    background:linear-gradient(135deg,#b91c1c,#ef4444);
    color:#fff;border-radius:24px;padding:28px 24px;
    box-shadow:0 16px 40px rgba(185,28,28,.20);
    margin-bottom:18px;
  }
  .badge{
    display:inline-block;background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.28);
    padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700
  }
  h1{font-size:30px;line-height:1.25;margin:14px 0 8px}
  .hero p{margin:0;opacity:.92}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.06);margin-top:16px
  }
  .status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:12px;padding:6px 10px;border-radius:999px;background:#f3f4f6;color:#374151}
  .chip.active{background:#fee2e2;color:#991b1b;font-weight:700}
  .dispatcher{
    background:#fff7ed;border:1px solid #fed7aa;border-left:6px solid var(--accent2);
    border-radius:14px;padding:16px;font-weight:700;line-height:1.7
  }
  .transcript{
    margin-top:14px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;
    padding:16px;min-height:84px
  }
  .label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
  .answer{font-size:18px;line-height:1.6}
  textarea{
    width:100%;min-height:92px;border:1px solid #cbd5e1;border-radius:14px;padding:12px;
    font:inherit;resize:vertical;margin-top:10px
  }
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  button{
    appearance:none;border:0;border-radius:14px;padding:13px 18px;font-size:15px;
    font-weight:800;cursor:pointer
  }
  .primary{background:var(--accent);color:white}
  .secondary{background:#111827;color:white}
  .ghost{background:#eef2f7;color:#334155}
  button:disabled{opacity:.45;cursor:not-allowed}
  .note{font-size:13px;color:var(--muted);line-height:1.6;margin-top:10px}
  .progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:14px 0 4px}
  .bar{height:100%;width:0;background:linear-gradient(90deg,#ef4444,#f97316);transition:.3s}
  .scorebox{text-align:center;padding:8px 0}
  .score{font-size:64px;font-weight:900;color:var(--accent);line-height:1}
  .resultTitle{font-size:22px;font-weight:900;margin-top:8px}
  .feedback{margin-top:18px;display:grid;gap:10px}
  .fb{
    display:flex;justify-content:space-between;gap:12px;align-items:center;
    border:1px solid var(--line);border-radius:14px;padding:12px 14px
  }
  .good{color:var(--ok);font-weight:800}
  .bad{color:#b45309;font-weight:800}
  .hidden{display:none}
  .footer{font-size:12px;color:#94a3b8;text-align:center;margin-top:22px}
  @media(max-width:520px){
    h1{font-size:26px}
    .wrap{padding:14px 12px 36px}
    .hero,.card{border-radius:18px}
    button{flex:1 1 100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <span class="badge">消防訓練プロトタイプ</span>
    <h1>119番通報 疑似体験デモ</h1>
    <p>消防指令員とのやり取りを想定し、通報に必要な情報を声に出して練習します。</p>
  </section>

  <section id="startCard" class="card">
    <h2>訓練シナリオ</h2>
    <p>あなたはオフィス内で火災を発見しました。安全を確保したうえで、119番通報を行う想定です。</p>
    <div class="actions">
      <button id="startBtn" class="primary">訓練を開始</button>
    </div>
    <p class="note">音声認識に対応していないブラウザでは、文字入力で回答できます。</p>
  </section>

  <section id="trainingCard" class="card hidden">
    <div class="status">
      <span class="chip active">119番通報訓練</span>
      <span id="stepChip" class="chip">質問 1 / 5</span>
    </div>

    <div class="progress"><div id="bar" class="bar"></div></div>

    <div class="label">消防指令員</div>
    <div id="question" class="dispatcher">119番です。火事ですか、救急ですか？</div>

    <div class="transcript">
      <div class="label">あなたの回答</div>
      <div id="liveAnswer" class="answer">マイクで話すか、下の欄に入力してください。</div>
    </div>

    <textarea id="textAnswer" placeholder="例：火事です。オフィスで火が出ています。"></textarea>

    <div class="actions">
      <button id="speakBtn" class="secondary">🎤 マイクで回答</button>
      <button id="nextBtn" class="primary">回答を確定して次へ</button>
      <button id="replayBtn" class="ghost">🔊 質問をもう一度聞く</button>
    </div>

    <p id="speechStatus" class="note"></p>
  </section>

  <section id="resultCard" class="card hidden">
    <div class="scorebox">
      <div class="label">訓練結果</div>
      <div id="score" class="score">0</div>
      <div class="resultTitle">点 / 100点</div>
      <p id="summary"></p>
    </div>
    <div id="feedback" class="feedback"></div>
    <div class="actions">
      <button id="retryBtn" class="primary">もう一度訓練する</button>
    </div>
  </section>

  <div class="footer">※本ページは訓練用の疑似体験です。実際の緊急時は119番へ通報してください。</div>
</div>

<script>
const questions = [
  {
    q:"119番です。火事ですか、救急ですか？",
    label:"火災・救急の区別",
    keywords:["火事","火災","燃えて"],
    point:20
  },
  {
    q:"場所を教えてください。住所や建物名は分かりますか？",
    label:"正確な場所",
    keywords:["丁目","番","号","ビル","会社","オフィス","大阪","東京","住所"],
    point:25
  },
  {
    q:"何が燃えていますか？",
    label:"具体的な状況",
    keywords:["燃え","煙","火","コピー","給湯","机","電気","コンセント","建物","室内"],
    point:20
  },
  {
    q:"建物の何階ですか？",
    label:"階数",
    keywords:["階","フロア"],
    point:15
  },
  {
    q:"けが人や逃げ遅れた人はいますか？",
    label:"けが人・逃げ遅れ",
    keywords:["いません","いない","います","けが","怪我","逃げ遅れ","確認","不明"],
    point:20
  }
];

let current = 0;
let answers = [];
let recognition = null;
let recognizing = false;

const startCard = document.getElementById("startCard");
const trainingCard = document.getElementById("trainingCard");
const resultCard = document.getElementById("resultCard");
const questionEl = document.getElementById("question");
const textAnswer = document.getElementById("textAnswer");
const liveAnswer = document.getElementById("liveAnswer");
const stepChip = document.getElementById("stepChip");
const bar = document.getElementById("bar");
const speechStatus = document.getElementById("speechStatus");

function speak(text){
  if(!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.rate = 0.95;
  u.pitch = 1.0;
  window.speechSynthesis.speak(u);
}

function renderQuestion(){
  const item = questions[current];
  questionEl.textContent = item.q;
  stepChip.textContent = `質問 ${current+1} / ${questions.length}`;
  bar.style.width = `${(current/questions.length)*100}%`;
  textAnswer.value = "";
  liveAnswer.textContent = "マイクで話すか、下の欄に入力してください。";
  speechStatus.textContent = "";
  setTimeout(()=>speak(item.q), 250);
}

function initRecognition(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    speechStatus.textContent = "このブラウザでは音声認識を利用できません。文字入力で進めてください。";
    document.getElementById("speakBtn").disabled = true;
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = "ja-JP";
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = ()=>{
    recognizing = true;
    speechStatus.textContent = "聞き取り中です。回答を話してください。";
    document.getElementById("speakBtn").textContent = "🎙️ 聞き取り中…";
  };

  recognition.onresult = (e)=>{
    let finalText = "";
    let interim = "";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalText += t;
      else interim += t;
    }
    const shown = finalText || interim;
    if(shown){
      liveAnswer.textContent = shown;
      textAnswer.value = shown;
    }
  };

  recognition.onerror = (e)=>{
    speechStatus.textContent = "音声認識でエラーが発生しました。文字入力でも回答できます。";
  };

  recognition.onend = ()=>{
    recognizing = false;
    document.getElementById("speakBtn").textContent = "🎤 マイクで回答";
    if(textAnswer.value.trim()){
      speechStatus.textContent = "回答を認識しました。内容を確認して「回答を確定して次へ」を押してください。";
    }
  };
}

function evaluate(){
  let score = 0;
  const details = [];
  questions.forEach((q, i)=>{
    const ans = (answers[i] || "").toLowerCase();
    const hit = q.keywords.some(k => ans.includes(k.toLowerCase()));
    if(hit) score += q.point;
    details.push({label:q.label, ok:hit, point:q.point});
  });

  document.getElementById("score").textContent = score;
  let summary = "";
  if(score >= 90) summary = "必要な情報を落ち着いて伝えられています。";
  else if(score >= 70) summary = "基本は押さえられています。場所や状況をより具体的に伝えるとさらに良くなります。";
  else summary = "通報時に必要な情報を、順番に整理して伝える練習を重ねましょう。";
  document.getElementById("summary").textContent = summary;

  const fb = document.getElementById("feedback");
  fb.innerHTML = "";
  details.forEach(d=>{
    const row = document.createElement("div");
    row.className = "fb";
    row.innerHTML = `<span>${d.label}</span><span class="${d.ok ? "good":"bad"}">${d.ok ? `OK +${d.point}点` : "要確認"}</span>`;
    fb.appendChild(row);
  });
}

document.getElementById("startBtn").onclick = ()=>{
  startCard.classList.add("hidden");
  resultCard.classList.add("hidden");
  trainingCard.classList.remove("hidden");
  current = 0;
  answers = [];
  initRecognition();
  renderQuestion();
};

document.getElementById("speakBtn").onclick = ()=>{
  if(!recognition) return;
  if(recognizing){
    recognition.stop();
    return;
  }
  try{ recognition.start(); }catch(e){}
};

document.getElementById("replayBtn").onclick = ()=>speak(questions[current].q);

document.getElementById("nextBtn").onclick = ()=>{
  const ans = textAnswer.value.trim();
  if(!ans){
    speechStatus.textContent = "回答を入力するか、マイクで話してください。";
    return;
  }
  answers[current] = ans;
  current++;
  if(current < questions.length){
    renderQuestion();
  } else {
    bar.style.width = "100%";
    trainingCard.classList.add("hidden");
    evaluate();
    resultCard.classList.remove("hidden");
    speak("訓練は終了です。結果を確認してください。");
  }
};

document.getElementById("retryBtn").onclick = ()=>{
  resultCard.classList.add("hidden");
  trainingCard.classList.remove("hidden");
  current = 0;
  answers = [];
  renderQuestion();
};
</script>
</body>
</html>
