<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>消防通報</title>
<style>
  :root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#667085;
    --accent:#e5482d;
    --accent2:#b62e1d;
    --line:#d9e0ea;
    --ok:#16794a;
    --ng:#b42318;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:linear-gradient(180deg,#eef3f9 0%,#f8fafc 100%);
    color:var(--text);
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:20px 14px 48px;
  }
  .hero{
    background:linear-gradient(135deg,#d83a25,#f0663d);
    color:#fff;
    border-radius:22px;
    padding:24px 20px;
    box-shadow:0 12px 28px rgba(196,62,39,.18);
  }
  .hero h1{
    margin:0 0 10px;
    font-size:clamp(28px,6vw,42px);
    letter-spacing:.04em;
  }
  .hero p{
    margin:0;
    line-height:1.75;
    font-size:15px;
  }
  .scenario{
    margin-top:14px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.28);
    padding:14px 16px;
    border-radius:14px;
    font-weight:700;
    line-height:1.7;
  }
  .card{
    margin-top:18px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 24px rgba(16,24,40,.06);
  }
  .step{
    color:var(--accent2);
    font-size:13px;
    font-weight:800;
    letter-spacing:.05em;
    margin-bottom:8px;
  }
  .question{
    font-size:clamp(20px,4.8vw,28px);
    font-weight:800;
    line-height:1.45;
    margin:0 0 8px;
  }
  .note{
    color:var(--muted);
    line-height:1.7;
    margin:0 0 16px;
    font-size:14px;
  }
  textarea{
    width:100%;
    min-height:110px;
    resize:vertical;
    border:2px solid var(--line);
    border-radius:14px;
    padding:14px;
    font:inherit;
    font-size:16px;
    line-height:1.6;
    outline:none;
    background:#fff;
  }
  textarea:focus{border-color:#ea6a53}
  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }
  button{
    border:0;
    border-radius:13px;
    padding:14px 12px;
    font:inherit;
    font-weight:800;
    cursor:pointer;
  }
  .primary{
    background:var(--accent);
    color:#fff;
  }
  .secondary{
    background:#eef2f7;
    color:#25324a;
  }
  button:disabled{opacity:.45;cursor:not-allowed}
  .feedback{
    margin-top:14px;
    border-radius:12px;
    padding:12px 14px;
    line-height:1.65;
    display:none;
  }
  .feedback.ok{
    display:block;
    background:#ecfdf3;
    color:var(--ok);
    border:1px solid #abefc6;
  }
  .feedback.ng{
    display:block;
    background:#fef3f2;
    color:var(--ng);
    border:1px solid #fecdca;
  }
  .progress{
    margin-top:18px;
    display:flex;
    gap:8px;
  }
  .dot{
    height:8px;
    flex:1;
    border-radius:999px;
    background:#e4e9f1;
  }
  .dot.done{background:var(--accent)}
  .complete{
    text-align:center;
    padding:28px 18px;
  }
  .complete .label{
    color:var(--muted);
    font-weight:700;
    margin-bottom:8px;
  }
  .keyword{
    margin-top:16px;
    padding:18px;
    border-radius:16px;
    background:#fff4f0;
    border:2px solid #f6a18f;
    font-size:clamp(22px,5.5vw,34px);
    font-weight:900;
    color:#a82f20;
  }
  .small{
    margin-top:12px;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
  }
  @media (max-width:520px){
    .actions{grid-template-columns:1fr}
    .card{padding:17px}
  }
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>消防通報</h1>
    <p>消防指令員からの質問に答えて、火災の状況を正確に伝えましょう。</p>
    <div class="scenario">
      【シナリオ】あなたのオフィスで火災が発生しました。<br>
      建物の2階が燃えています。
    </div>
  </section>

  <div class="progress" id="progress" aria-label="進捗"></div>

  <section class="card" id="gameCard">
    <div class="step" id="stepLabel"></div>
    <h2 class="question" id="question"></h2>
    <p class="note" id="note"></p>

    <textarea id="answer" placeholder="ここに回答を入力してください"></textarea>

    <div class="actions">
      <button class="secondary" id="backBtn" type="button">1つ前の質問に戻る</button>
      <button class="secondary" id="speakBtn" type="button">質問を読み上げる</button>
      <button class="secondary" id="micBtn" type="button">マイクで回答</button>
      <button class="primary" id="submitBtn" type="button">回答する</button>
      <button class="secondary" id="resetBtn" type="button">最初からやり直す</button>
    </div>

    <div class="feedback" id="feedback"></div>
  </section>
</main>

<script>
(() => {
  const questions = [
    {
      text: "火事ですか、救急ですか？",
      note: "",
      check: (v) => /火事|火災|かじ|かさい|カジ|カサイ/.test(v),
      ng: "今回は火災の通報です。「火事」「火災」「かじ」「かさい」「カジ」「カサイ」などを含めて答えてください。"
    },
    {
      text: "場所を教えてください。住所や建物名は分かりますか？",
      note: "※あなたのオフィスを伝えてください",
      check: (v) => hasAddressLike(v) && hasBuildingLike(v),
      ng: "住所と建物名の両方を伝えてください。どちらか片方だけでは次へ進めません。"
    },
    {
      text: "建物の何階が燃えていますか？",
      note: "",
      check: (v) => /2|２|二/.test(v),
      ng: "シナリオを確認して、燃えている階を伝えてください。"
    }
  ];

  let index = 0;

  const stepLabel = document.getElementById("stepLabel");
  const question = document.getElementById("question");
  const note = document.getElementById("note");
  const answer = document.getElementById("answer");
  const feedback = document.getElementById("feedback");
  const gameCard = document.getElementById("gameCard");
  const progress = document.getElementById("progress");
  const submitBtn = document.getElementById("submitBtn");
  const speakBtn = document.getElementById("speakBtn");
  const micBtn = document.getElementById("micBtn");
  const resetBtn = document.getElementById("resetBtn");
  const backBtn = document.getElementById("backBtn");

  function hasAddressLike(v){
    const s = v.replace(/\s+/g, "");
    const prefectureCity = /(都|道|府|県|市|区|町|村)/.test(s);
    const numbered = /[0-9０-９一二三四五六七八九十]+(?:丁目|番|号|-|−|ー)/.test(s);
    return prefectureCity && numbered;
  }

  function hasBuildingLike(v){
    const s = v.replace(/\s+/g, "");
    return /(ビル|タワー|センター|オフィス|会館|館|庁舎|本社|支社|支店|営業所|プラザ|スクエア|ビルディング|building)/i.test(s);
  }

  function renderProgress(){
    progress.innerHTML = "";
    questions.forEach((_, i) => {
      const d = document.createElement("div");
      d.className = "dot" + (i < index ? " done" : "");
      progress.appendChild(d);
    });
  }

  function render(){
    renderProgress();
    feedback.className = "feedback";
    feedback.textContent = "";
    answer.value = "";

    if(index >= questions.length){
      gameCard.innerHTML = `
        <div class="complete">
          <div class="label">消防通報 完了</div>
          <div>すべての質問に回答できました。</div>
          <div class="keyword">①のキーワードは「レスキュー」です。</div>
          <div class="small">キーワードを忘れないようにしてください。</div>
          <button class="secondary" type="button" style="margin-top:18px" onclick="location.reload()">最初からやり直す</button>
        </div>
      `;
      progress.querySelectorAll(".dot").forEach(d => d.classList.add("done"));
      return;
    }

    const q = questions[index];
    stepLabel.textContent = `質問 ${index + 1} / ${questions.length}`;
    question.textContent = q.text;
    note.textContent = q.note;
    backBtn.disabled = index === 0;
    answer.focus();
  }

  function submit(){
    const v = answer.value.trim();
    if(!v){
      feedback.className = "feedback ng";
      feedback.textContent = "回答を入力してください。";
      return;
    }

    const q = questions[index];
    if(q.check(v)){
      feedback.className = "feedback ok";
      feedback.textContent = "回答できました。次の質問へ進みます。";
      setTimeout(() => {
        index++;
        render();
        speakCurrent();
      }, 650);
    } else {
      feedback.className = "feedback ng";
      feedback.textContent = q.ng;
    }
  }

  function goBack(){
    if(index > 0){
      index--;
      render();
    }
  }

  function speakCurrent(){
    if(!("speechSynthesis" in window) || index >= questions.length) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(questions[index].text);
    u.lang = "ja-JP";
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }

  function startMic(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      feedback.className = "feedback ng";
      feedback.textContent = "このブラウザでは音声入力に対応していません。文字で回答してください。";
      return;
    }
    const rec = new SR();
    rec.lang = "ja-JP";
    rec.interimResults = false;
    rec.maxAlternatives = 1;

    micBtn.disabled = true;
    micBtn.textContent = "聞き取り中…";

    rec.onresult = (e) => {
      answer.value = e.results[0][0].transcript;
    };
    rec.onerror = () => {
      feedback.className = "feedback ng";
      feedback.textContent = "音声を認識できませんでした。もう一度試すか、文字で回答してください。";
    };
    rec.onend = () => {
      micBtn.disabled = false;
      micBtn.textContent = "マイクで回答";
    };
    rec.start();
  }

  submitBtn.addEventListener("click", submit);
  speakBtn.addEventListener("click", speakCurrent);
  micBtn.addEventListener("click", startMic);
  resetBtn.addEventListener("click", () => {
    index = 0;
    render();
  });
  backBtn.addEventListener("click", goBack);

  answer.addEventListener("keydown", (e) => {
    if((e.ctrlKey || e.metaKey) && e.key === "Enter") submit();
  });

  render();
})();
</script>
</body>
</html>
